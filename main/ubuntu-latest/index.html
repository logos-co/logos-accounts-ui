<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"failed": 0, "passed": 4, "skipped": 0}, "tutorials": [{"meta": {"name": "Writing an account log: a key, a name, an installation, one update", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Writing an account log: a key, a name, an installation, one update\n\nAn account, in Logos, is not a row in a table. It is an append-only **log**\nof entries, signed as a whole by one key, published under the address that\nkey derives. Nothing in it is ever deleted: revoking a key is itself an\nentry, pointing at the one it revokes.\n\n`accounts_ui` is the app that writes such a log. This doc-test builds it,\nlaunches it headless through\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp), and drives it the\nway a person would: make a key, give the account a name, endorse an\ninstallation, publish, and then read an account whose key it does not hold.\nThe screenshot below is the real app at the end of that run, and every number\nin it was measured by the app's own library rather than written into this\npage.\n\n**What you'll build:** A published account log with two entries, written by driving the real UI: an account key sealed with a password, a display name, and an endorsed installation key.\n\n**What you'll learn:**\n\n- Why an account is a log, and why nothing in it is ever removed\n- What an account without its key is, and what a module can do with one\n- What a staged edit is, and why a publish is all of them or none\n- What each kind of entry costs the log's 32 KiB lifetime budget, and where that number comes from\n- How a `ui_qml` Logos plugin is launched standalone and driven headless\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** The app runs under `QT_QPA_PLATFORM=offscreen`, so no display is needed.\n- **No network account needed.** The run publishes to an in-process store."}, {"execs": [], "md": "## Step 1: Build the app\n\nOne flake output builds everything: the Rust library that decides what an\naccount may do, the C++ backend that marshals for it, and the QML the\nperson reads. The library is built inside this flake and handed to the\nmodule builder as an external library, so the archive and the plugin that\nlinks it are versioned by one commit."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-accounts-ui/5e51a2ec2f6c8ec671cd9b8b961583f160170793' -o result", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-accounts-ui' -o result\n```"}, {"execs": [{"cmd": "check file: result/lib/*accounts_ui*plugin.so", "kind": "check_file", "note": "Found: /home/runner/work/_temp/doctest-test-eb4h6i23/result/lib/accounts_ui_plugin.so", "status": "pass"}], "md": "### 1.2 The plugin really landed"}, {"execs": [{"cmd": "ls result/lib", "exit_code": 0, "kind": "run", "note": "", "output": "accounts_ui_plugin.so\naccounts_ui_replica_factory.so\nmetadata.json\nqml\nsrc\n", "status": "pass"}], "md": "### 1.3 What a Logos plugin is, on disk\n\n```bash\nls result/lib\n```\n\n`metadata.json` declares the plugin `type: ui_qml` and names its view;\n`qml/` is the view itself; the shared library holds the backend. The\nhost reads the metadata, loads the library into an isolated `ui-host`\nchild process, and renders the QML in its own window."}, {"execs": [], "md": "## Step 2: Write an account log\n\n`nix run` on this flake launches the plugin inside\n[`logos-standalone-app`](https://github.com/logos-co/logos-standalone-app),\nthe generic Qt host, built against the design-system revision basecamp\n0.3.0 ships. Everything from here is the app driven through its own QML\nsurface: no test hooks, no back doors into the library.\n\nThe `walkthrough` app is what drives it. It launches the plugin headless\non an empty vault, makes a key sealed with a password, names the account,\npublishes, endorses an installation key and publishes again. Then it\nmakes a second account, publishes a name from it, gives its key up, and\ntakes the address back on as one it only reads. Every step is finished\nwhen the app itself says so, and the picture is taken then, so each one\nbelow is a state the app really reached.\n\nTwo things make that run hermetic. `LOGOS_ACCOUNTS_VAULT_DIR` puts the\nkey files in the run's own directory, so the walkthrough always starts\nfrom an empty vault. `LOGOS_ACCOUNTS_SEQUENCER_URL=memory` selects the\nin-process store instead of the account registry on LEZ, so the run needs\nno network or wallet and leaves no log behind, and the in-process store\nenforces the same rule the registry program does, that a log is accepted\nonly where it extends the one already held.\n\nThere is nothing to manage until the module holds a key, so an empty vault\nopens the door itself. The app writes accounts, so every account it holds\nneeds that account's signing key: it can make one, or take custody of one\nmade elsewhere.\n\n![An empty vault opens its own door](images/01-add-an-account.png)\n\nA password seals this one account's key as an eth-keystore document;\nwithout one the key is stored unsealed, and the screen says which at every\npoint where it matters. The choice is per account, not per module.\n\n![The password is the account's own choice](images/02-create-an-account.png)\n\nThe key now exists on this computer and the address is derived from it,\nbut the store has never heard of it. An update that stages no entry is\nrefused, so the address is claimed by the log's first entry and never by\nan empty publish.\n\n![A key, and nothing published](images/03-nothing-published-yet.png)\n\nNaming the account sends nothing. Edits collect as **entries**, numbered\nas they will be once the update lands, and the bar prices the next publish\nbefore it happens: 24 bytes for an empty display-name entry by the\nformat's own encoder, plus the four UTF-8 bytes of `Saro`.\n\n![The edit is staged, not written](images/04-one-pending-entry.png)\n\nEntry `#0` is the name, written under `profile.displayname`. The whole log\nwas signed, not just the new entry, which is why a publish is all of the\nstaged entries or none of them.\n\n![The store serves the first entry](images/05-first-entry-published.png)\n\nAn endorsement costs 48 bytes whatever the key. Entry `#1` writes it under\n`chat.signer`, and the live set replayed from the log now names one\ninstallation. Entry `#0` is still there and still says `Saro`: the log\ngrew, nothing in it moved.\n\n![The account endorses an installation](images/06-installation-endorsed.png)\n\nAn account is a log in a store, and a key is what writes it. Take the key\naway and the log is still there, still verifiable against the address\nthat names it, and still readable by anyone who asks the store for it. So\nthe walkthrough makes a second account, publishes a name from it, gives\nits key up, and then takes the address back on as one it only **observes**\n-- the one way a run with no second computer can show what every other\naccount in the world looks like from here.\n\nWhat comes back is the same screen with everything that needs a key taken\nout of it: the log as the store serves it, verified under that address,\nand nothing to publish. Reading an account takes no key and sends none,\nand the account never learns that anyone is reading.\n\n![An account this module reads and cannot write](images/07-an-observed-account.png)"}, {"execs": [{"actions": [{"description": "The account log, written and published: wait for ['#1', '28', '48', '1 live']", "duration_ms": 33, "index": 1, "status": "pass"}], "cmd": "nix run 'github:logos-co/logos-accounts-ui/5e51a2ec2f6c8ec671cd9b8b961583f160170793#walkthrough'", "ki count log leads with, 28 for the name, 48 for the endorsement.\nThe registry caps the payload at 32 KiB, and that cap is a **lifetime**\nbudget, because nothing is ever removed to make room. A new name later\ncosts only its own entry, and `Saro` stays readable beneath it.\n\nThat is why the app quotes a price before it stages an edit, and why every\none of those numbers is measured by encoding the entry with the format's\nown encoder rather than recomputed here. A screen that disagreed with the\nencoder would be a screen that lies about how much life the account has\nleft.\n\nThe store this run published to was in-process. Against LEZ the same\nbytes go to the account registry, paid for by the LEZ wallet; nothing\nabove changes, because the registry stores the very artifact the app\nsigns."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
